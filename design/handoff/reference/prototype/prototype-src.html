<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Calculadora de Batería · Prototipo</title>
<meta name="theme-color" content="#0D1626">
<style>
@font-face{font-family:"AH";font-weight:400;font-display:swap;src:url(data:font/woff2;base64,__F400__) format("woff2")}
@font-face{font-family:"AH";font-weight:700;font-display:swap;src:url(data:font/woff2;base64,__F700__) format("woff2")}
:root{--bg:#EEF2F6;--sf:#FFFFFF;--sf2:#E3E9F0;--tx:#122033;--tx2:#46566C;--ln:#74859C;--ln2:#D3DBE5;--amb:#E39B2D;--ambTx:#8A5300;--onAmb:#1B1203;--ok:#1E6B4A;--okBg:#E2F3EA;--bad:#A3392E;--badBg:#FBE8E5;--inf:#1F5FA8;--infBg:#E3EDFA;--warn:#6B4200;--warnBg:#FFF0D2;--rsv:#B5574B;--focus:#1F5FA8;--nav:#FFFFFF;--sel:#FCE7C4;--track:#D5DDE7;--dis:#8C98A8;--disBg:#E7ECF2;--chg:#2F7D5B;--scrim:rgba(8,14,26,.55);--outer:#D6DDE6;color-scheme:light}
:root[data-theme=dark]{--bg:#0D1626;--sf:#162236;--sf2:#203049;--tx:#F2F5F9;--tx2:#B4C0D0;--ln:#7F92B0;--ln2:#2C3B55;--amb:#F0A93B;--ambTx:#F6BC5E;--onAmb:#1B1203;--ok:#7DDBA9;--okBg:#12352A;--bad:#FF9E92;--badBg:#3D1F22;--inf:#9CC6F5;--infBg:#15304F;--warn:#FFD38A;--warnBg:#3A2A10;--rsv:#E0786B;--focus:#9CC6F5;--nav:#121D2F;--sel:#3B2D14;--track:#2A3A55;--dis:#6E7C91;--disBg:#1C283C;--chg:#57B98A;--scrim:rgba(0,0,0,.6);--outer:#05090F;color-scheme:dark}
html{font-size:16px;-webkit-text-size-adjust:100%}
html.lgtext{font-size:19.2px}
*{box-sizing:border-box}
body{margin:0;background:var(--outer);color:var(--tx);font-family:"AH",system-ui,sans-serif;line-height:1.35}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:calc(6rem + env(safe-area-inset-bottom))}
.app.first{padding-bottom:0}
svg.i{width:1.5rem;height:1.5rem;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
/* top */
.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 4px 6px 12px}
.chip{min-height:48px;display:flex;align-items:center;gap:8px;padding:0 14px 0 12px;border-radius:24px;border:1.5px solid var(--ln);background:var(--sf);font-size:.94rem;min-width:0}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:48px;height:48px;flex:none;border:0;border-radius:24px;background:transparent;display:flex;align-items:center;justify-content:center}
.ibtn:active{background:var(--sf2)}
.strip{position:sticky;z-index:19;top:calc(60px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 14px;background:var(--sf);border-bottom:1px solid var(--ln2);box-shadow:0 2px 6px rgba(10,20,40,.1);margin-bottom:-56px}
.strip b{flex:1;font-size:1.12rem;min-width:0}
.pill{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-weight:700;font-size:.875rem;flex:none}
.pill svg.i{width:1rem;height:1rem;stroke-width:3}
.k-ok{color:var(--ok);background:var(--okBg)}.k-bad{color:var(--bad);background:var(--badBg)}.k-err{color:var(--bad);background:var(--badBg)}.k-info{color:var(--inf);background:var(--infBg)}.k-warn{color:var(--warn);background:var(--warnBg)}.k-neutral{color:var(--tx2);background:var(--sf2)}
main{display:flex;flex-direction:column;gap:12px;padding:4px 12px 16px}
/* cards */
.card{background:var(--sf);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:18px}
.card h2{margin:0;font-size:1.12rem}
.res{gap:12px;padding:14px 16px 16px;box-shadow:0 1px 2px rgba(10,20,40,.08);scroll-margin-top:80px}
.kick{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kick span{font-size:.875rem;font-weight:700;color:var(--tx2);display:flex;align-items:center;gap:6px}
.kick span svg.i{width:1.1rem;height:1.1rem}
.kick .ibtn{margin:-12px -8px -10px 0}
.lead{font-size:1.06rem;color:var(--tx2)}
.big{font-size:3rem;font-weight:700;line-height:1.04;letter-spacing:-.015em}
.sub{font-size:1.06rem;font-weight:700}
.vd{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:16px}
.badge{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.badge svg.i{width:22px;height:22px;stroke-width:2.8}
.b-ok{background:var(--ok);color:var(--okBg)}.b-bad,.b-err{background:var(--bad);color:var(--badBg)}.b-info{background:var(--inf);color:var(--infBg)}.b-warn{background:var(--warn);color:var(--warnBg)}.b-neutral{background:var(--tx2);color:var(--sf2)}
.vd .t{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.vd b{font-size:1.12rem;line-height:1.25}
.vd.k-ok b{color:var(--ok)}.vd.k-bad b,.vd.k-err b{color:var(--bad)}.vd.k-info b{color:var(--inf)}.vd.k-warn b{color:var(--warn)}
.vd .x{font-size:.94rem;line-height:1.4;color:var(--tx)}
.stc{display:flex;gap:14px;align-items:flex-start}
.stc .badge{width:44px;height:44px}
.stc b{font-size:1.37rem;line-height:1.2;display:block}
.stc span{font-size:1rem;line-height:1.4;color:var(--tx2)}
.figs{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px}
.fig{background:var(--sf2);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fig b{font-size:1rem;white-space:nowrap}
.fig span{font-size:.81rem;line-height:1.25;color:var(--tx2)}
.track{display:flex;flex-direction:column;gap:14px;padding:6px 4px 0}
.tr{position:relative;height:14px;border-radius:7px;background:var(--track);outline:1.5px solid var(--ln);margin-right:18px}
.tr .f{position:absolute;left:0;top:0;bottom:0;background:var(--amb);border-radius:7px 0 0 7px}
.tr .gap{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--rsv) 0 3px,transparent 3px 8px)}
.tr .end{position:absolute;top:-7px;width:4px;height:28px;margin-left:-2px;border-radius:2px;background:var(--tx)}
.tr .sun{position:absolute;top:-12px;width:38px;height:38px;margin-left:-19px;border-radius:50%;background:var(--sf);border:2.5px solid var(--tx);display:flex;align-items:center;justify-content:center}
.tr .sun svg.i{width:20px;height:20px}
.tr .arr{position:absolute;right:-6px;top:-7px;color:var(--ambTx)}
.tr .arr svg.i{width:28px;height:28px;stroke-width:3}
.tr.chg .f{background:var(--chg)}
.tr.chg .slow{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(135deg,var(--chg) 0 4px,transparent 4px 8px);border-radius:0 7px 7px 0}
.leg{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:6px}
.leg div{display:flex;flex-direction:column;gap:1px;min-width:0}
.leg div:nth-child(2){text-align:center}.leg div:last-child{text-align:right}
.leg div:first-child{text-align:left}
.leg span{font-size:.81rem;color:var(--tx2)}
.leg b{font-size:.94rem;line-height:1.25}
.narrow .figs{grid-template-columns:1fr;background:var(--sf2);border-radius:12px;padding:2px 12px;gap:0}
.narrow .fig{flex-direction:row-reverse;justify-content:space-between;align-items:baseline;padding:8px 0;border-radius:0;background:none}
.narrow .fig+.fig{border-top:1px solid var(--ln2)}
.narrow .leg{grid-template-columns:1fr}
.narrow .leg div{flex-direction:row;justify-content:space-between;text-align:left!important}
/* fields */
.fld{display:flex;flex-direction:column;gap:6px}
.lab{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:6px}
.lab svg.i{width:1.1rem;height:1.1rem}
.lab2{font-size:.94rem;font-weight:700;color:var(--tx2)}
.box{min-height:56px;border:1.5px solid var(--ln);border-radius:14px;background:var(--sf);display:flex;align-items:center;gap:8px;padding:0 14px;width:100%}
.box:focus-within{border:2px solid var(--focus);box-shadow:0 0 0 4px var(--infBg);padding:0 13.5px}
.box.err{border:2px solid var(--bad)}.box.warn{border:2px solid var(--warn)}
.box input{flex:1;min-width:0;width:100%;border:0;outline:none;background:transparent;font-size:1.37rem;font-weight:700;padding:12px 0}
.box input::placeholder{color:var(--dis);font-weight:700}
.box .u{font-size:1.06rem;font-weight:700;color:var(--tx2);flex:none}
.box input[type=time]{font-size:1.25rem}
.box.c input{text-align:center}
.hint{font-size:.875rem;line-height:1.4;color:var(--tx2)}
.msg{display:flex;gap:6px;align-items:flex-start;font-size:.94rem;line-height:1.35}
.msg svg.i{width:1.25rem;height:1.25rem;stroke-width:2.2}
.m-err{color:var(--bad);font-weight:700}.m-info{color:var(--inf)}
.m-warn{color:var(--warn);background:var(--warnBg);padding:8px 10px;border-radius:10px;font-weight:700;gap:8px}
.msgs{display:flex;flex-direction:column;gap:6px}
.msgs:empty{display:none}
.row{display:flex;gap:8px;align-items:stretch}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g2>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.btn-now{flex:none;min-height:56px;min-width:72px;padding:0 12px;border-radius:14px;border:2px solid var(--tx);background:transparent;font-weight:700}
.btn-now:active,.sec:active{background:var(--sf2)}
/* battery */
.batrow{display:flex;align-items:center;gap:10px}
.bat{position:relative;display:flex;align-items:center;flex:1;min-width:0;padding:0 4px;touch-action:none}
.bat .body{position:relative;flex:1;height:56px;border:3px solid var(--tx);border-radius:12px;padding:5px}
.bat .in{position:relative;width:100%;height:100%}
.bat .cap{width:7px;height:22px;background:var(--tx);border-radius:0 4px 4px 0;flex:none}
.bat .rsv{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--rsv) 0 3px,transparent 3px 7px);border-radius:6px 0 0 6px}
.bat .fill{position:absolute;top:0;bottom:0;background:var(--amb);border-radius:3px}
.bat .stripe{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--chg) 0 4px,transparent 4px 8px)}
.bat .th{position:absolute;top:-13px;bottom:-13px;width:16px;margin-left:-8px;border-radius:8px;background:var(--sf);border:3px solid var(--tx);pointer-events:none}
.bat input[type=range]{position:absolute;top:-16px;bottom:-16px;height:auto;margin:0;opacity:0;-webkit-appearance:none;appearance:none;background:transparent;pointer-events:none;cursor:pointer}
.bat input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:40px;height:88px;pointer-events:auto;cursor:grab}
.bat input[type=range]::-moz-range-thumb{width:40px;height:88px;pointer-events:auto;border:0}
.bat input.solo{pointer-events:auto}
.bat.f0 .th.t0,.bat.f1 .th.t1{box-shadow:0 0 0 4px var(--focus)}
.pctbox{width:6.25rem;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.875rem;color:var(--tx2)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:16px;height:16px;border-radius:4px;flex:none}
.sw.r{border:1.5px solid var(--rsv);background:repeating-linear-gradient(135deg,var(--rsv) 0 2px,transparent 2px 5px)}
.sw.a{background:var(--amb)}
.sw.g{border:1.5px solid var(--chg);background:repeating-linear-gradient(135deg,var(--chg) 0 2px,transparent 2px 5px)}
/* seg */
.seg{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:4px;padding:4px;border-radius:15px;background:var(--sf2);border:1.5px solid var(--ln)}
.seg button{border:0;border-radius:11px;min-height:48px;padding:4px 8px;display:flex;align-items:center;justify-content:center;gap:6px;background:transparent;font-size:.94rem;line-height:1.2}
.seg button[aria-pressed=true]{background:var(--tx);color:var(--bg);font-weight:700}
.seg button svg.i{width:1.1rem;height:1.1rem}
.seg button[aria-pressed=false] svg.i{display:none}
.narrow .bl{display:none}
.seg button[aria-pressed=true] svg.i{stroke-width:3}
.presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.presets button{position:relative;min-height:64px;border-radius:14px;border:1.5px solid var(--ln);background:var(--sf);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px}
.presets button b{font-size:1.25rem}.presets button span{font-size:.81rem;color:var(--tx2)}
.presets button[aria-pressed=true]{border:2.5px solid var(--tx);background:var(--sel)}
.presets button .ck{display:none;position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:11px;background:var(--tx);color:var(--bg);align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--sf)}
.presets button[aria-pressed=true] .ck{display:flex}
.presets .ck svg.i{width:14px;height:14px;stroke-width:3.4}
/* switch */
.swt{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:6px 0;border:0;background:transparent;text-align:left}
.swt .t{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.swt .t b{font-size:1rem}
.swt .t span{font-size:.875rem;line-height:1.4;color:var(--tx2)}
.swt .k{position:relative;width:56px;height:32px;border-radius:16px;flex:none;background:var(--sf2);border:2px solid var(--ln)}
.swt .k i{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:12px;background:var(--ln);display:flex;align-items:center;justify-content:center;transition:left .15s}
.swt[aria-checked=true] .k{background:var(--tx);border-color:var(--tx)}
.swt[aria-checked=true] .k i{left:26px;background:var(--bg);color:var(--tx)}
.swt .k svg.i{width:16px;height:16px;stroke-width:3.2;display:none}
.swt[aria-checked=true] .k svg.i{display:block}
/* disclosure */
.dis{border-top:1px solid var(--ln2);display:flex;flex-direction:column}
.dis>button{width:100%;min-height:56px;display:flex;align-items:center;gap:12px;background:transparent;border:0;padding:10px 0;text-align:left}
.dis>button .t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.dis>button .t b{font-size:1rem}.dis>button .t span{font-size:.875rem;color:var(--tx2)}
.dis>button>svg.i:first-child{color:var(--tx2)}
.dis>button[aria-expanded=true] .chev{transform:rotate(180deg)}
.dis .body{display:flex;flex-direction:column;gap:14px;padding:0 0 8px}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:.94rem;line-height:1.45;counter-increment:s}
.steps li::before{content:counter(s);width:26px;height:26px;flex:none;border-radius:13px;background:var(--sf2);font-size:.875rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.note{margin:0;font-size:.875rem;line-height:1.5;color:var(--tx2);display:flex;gap:8px}
.note svg.i{width:1.1rem;height:1.1rem}
/* buttons */
.pri,.sec,.txt{width:100%;min-height:56px;border-radius:16px;padding:8px 18px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.06rem;font-weight:700;line-height:1.2}
.pri{background:var(--amb);color:var(--onAmb);border:2px solid var(--amb)}
.pri:active{background:var(--ambTx);border-color:var(--ambTx);color:var(--bg)}
.pri:disabled{background:var(--disBg);color:var(--dis);border:2px dashed var(--dis);cursor:not-allowed}
.sec{background:transparent;color:var(--tx);border:2px solid var(--tx)}
.sec.sm,.txt.sm{min-height:48px;width:auto;align-self:flex-start;font-size:1rem}
.txt{background:transparent;border:2px solid transparent;text-decoration:underline;text-underline-offset:4px;color:var(--tx)}
.txt:disabled{color:var(--dis);text-decoration:none;cursor:default}
.sbtn{width:56px;min-height:56px;flex:none;border-radius:14px;border:2px solid var(--tx);background:transparent;display:flex;align-items:center;justify-content:center}
.sbtn svg.i{stroke-width:2.6}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;max-width:480px;margin:0 auto;background:var(--nav);border-top:1px solid var(--ln2);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:8px 12px calc(14px + env(safe-area-inset-bottom))}
nav.tabs button{border:0;border-radius:16px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.875rem;line-height:1.15;padding:4px;background:transparent;color:var(--tx2)}
nav.tabs button .bd{width:56px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center}
nav.tabs button[aria-current=page]{background:var(--sel);color:var(--tx);font-weight:700}
nav.tabs button[aria-current=page] .bd{background:var(--amb);color:var(--onAmb)}
nav.tabs svg.i{width:1.3rem;height:1.3rem}
/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;max-height:92vh;overflow:auto;background:var(--sf);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet .handle{width:40px;height:5px;border-radius:3px;background:var(--ln);align-self:center;flex:none}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:-6px}
.sheet h2{margin:0;font-size:1.37rem}
.sheet .hd .ibtn{margin-right:-10px}
.eq{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--infBg);font-size:1rem}
.eq .badge{width:32px;height:32px}
.prev{display:flex;gap:16px;align-items:flex-start}
.prev img{width:120px;border-radius:12px;box-shadow:0 0 0 1px var(--ln2);flex:none;background:var(--sf2);min-height:200px}
.prev b{font-size:1.06rem}
/* first */
.firstv{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;gap:20px;padding:calc(28px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;gap:14px}
.brand h1{margin:0;font-size:1.5rem;line-height:1.15}
.brand .ok{font-size:.875rem;color:var(--tx2);display:flex;align-items:center;gap:6px}
.brand .ok svg.i{width:1rem;height:1rem}
.logo{width:56px;height:56px;border-radius:16px;box-shadow:0 0 0 1.5px var(--ln);flex:none;display:block}
.intro{margin:0;font-size:1.06rem;line-height:1.45;color:var(--tx2)}
.firstv .foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:.94rem;max-width:min(90vw,420px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.proto{font-size:.81rem;color:var(--tx2);text-align:center;padding:6px 12px 0}
@media (min-width:520px){.app{box-shadow:0 0 0 1px var(--ln2)}}
</style>
</head>
<body>
<div class="app" id="app">

<!-- FIRST RUN -->
<section class="firstv" id="first" hidden aria-labelledby="fTitle">
  <div class="brand"><svg class="logo" viewBox="0 0 108 108" role="img" aria-hidden="true" data-logo></svg><div><h1 id="fTitle" data-t="appName"></h1><span class="ok"><svg class="i" data-i="checkc"></svg><span data-t="offline"></span></span></div></div>
  <p class="intro" data-t="intro"></p>
  <section class="card" style="gap:16px">
    <h2 style="display:flex;gap:8px;align-items:center;font-size:1.25rem"><svg class="i" data-i="battery"></svg><span data-t="sizeQ"></span></h2>
    <div class="seg" style="--n:2" role="group" data-ta="batHow" data-seg="batmode">

const RSV_DEF=6,LOSS=0.9,SLOW_AT=90,WEIRD_KW=10,WEIRD_KWH=100;

/* ---------- state ---------- */
const KEY='calc-bateria-proto-v1';
const now0=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
let S={cap:null,batmode:'kwh',capTxt:'',volt:'51,2',ahTxt:'',tab:'night',nPct:'85',nW:'600',nNow:now0(),nSun:'07:00',loss:true,rsv:'6',cPct:'30',cTgt:'100',pmode:'w',cW:'2500',cA:'50',cV:'51,2',cNow:now0(),lang:(navigator.language||'es').toLowerCase().startsWith('en')?'en':'es',theme:'auto',big:false};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s)S=Object.assign(S,s,{nNow:now0(),cNow:now0()})}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const T=k=>STR[S.lang][k];
const touched={};
let draftBat=null;

/* ---------- format ---------- */
const nf=(x,d)=>x.toLocaleString(S.lang==='es'?'es-ES':'en-US',{useGrouping:false,minimumFractionDigits:0,maximumFractionDigits:d});
const kwh=(x,d=2)=>nf(x,d)+' kWh';
const wh=x=>{const w=x*1000;return nf(w,w>=100?0:w>=10?1:2)+' Wh'};
const q=x=>x<0.1?wh(x):kwh(x);
const B3=x=>x<0.1?wh(x):nf(x,3)+' kWh';
const h12=(()=>{try{return new Intl.DateTimeFormat(undefined,{hour:'numeric'}).resolvedOptions().hour12!==false}catch(e){return true}})();
function fmtT(mins){const d=new Date(2000,0,1,0,0);d.setMinutes(Math.round(mins));return new Intl.DateTimeFormat(S.lang==='es'?'es-ES':'en-US',{hour:'numeric',minute:'2-digit',hour12:h12}).format(d).replace(/\s/g,' ')}
function artT(mins){const h=Math.floor(((Math.round(mins)%1440)+1440)%1440/60);const h12v=h%12===0?12:h%12;return T('art')(h12?h12v:h)}
const isDays=h=>isFinite(h)&&Math.round(h*60)>=1440;
function dur(h){if(!isFinite(h))return '∞';if(isDays(h)){const d=h/24;return T('days')(nf(d,d<10?1:0))}const m=Math.round(h*60),a=Math.floor(m/60),b=m%60;return a===0?b+' min':a+' h'+(b?' '+b+' min':'')}
const mins=v=>{if(!v)return null;const [a,b]=v.split(':').map(Number);return isFinite(a)&&isFinite(b)?a*60+b:null};

/* ---------- parse ---------- */
function parse(raw,thousands){
  const s=String(raw).trim();
  if(s==='')return{empty:true,v:NaN};
  if(!/^[\d.,]+$/.test(s))return{v:NaN};
  const m=s.match(/^(\d{1,3})[.,](\d{3})$/);
  if(m&&thousands){const v=parseFloat(m[1]+m[2]);return{v,note:true,alt:m[1]+(S.lang==='es'?',':'.')+m[2],sep:s.includes('.')?'sepDot':'sepComma'}}
  const seps=(s.match(/[.,]/g)||[]).length;
  if(seps>1)return{v:NaN};
  let t=s.replace(',','.');if(t.startsWith('.'))t='0'+t;if(t.endsWith('.'))t+='0';
  return{v:parseFloat(t)};
}
const num=x=>nf(x,6);

/* ---------- icons/text init ---------- */
function paintStatic(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll('[data-i]').forEach(e=>{e.setAttribute('viewBox','0 0 24 24');e.setAttribute('aria-hidden','true');e.classList.add('i');e.innerHTML=ICONS[e.dataset.i]});
  document.querySelectorAll('[data-logo]').forEach(e=>e.innerHTML=LOGO);
  document.querySelectorAll('[data-t]').forEach(e=>{const v=T(e.dataset.t);if(typeof v==='string')e.textContent=v});
  document.querySelectorAll('[data-ta]').forEach(e=>e.setAttribute('aria-label',T(e.dataset.ta)));
  document.querySelectorAll('[data-tp]').forEach(e=>e.setAttribute('placeholder',T(e.dataset.tp)));
  document.querySelectorAll('[data-tpa]').forEach(e=>e.setAttribute('aria-label',T(e.dataset.tpa)));
  document.querySelectorAll('[data-ta-n]').forEach(e=>e.setAttribute('aria-label',T(e.dataset.taN)));
  document.title=T('appName')+' · '+(S.lang==='es'?'Prototipo':'Prototype');
}

/* ---------- theme / size ---------- */
const mq=matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){const d=S.theme==='dark'||(S.theme==='auto'&&mq.matches);document.documentElement.dataset.theme=d?'dark':'light';document.documentElement.classList.toggle('lgtext',S.big);document.querySelector('meta[name=theme-color]').content=d?'#0D1626':'#EEF2F6';checkNarrow()}
mq.addEventListener&&mq.addEventListener('change',applyTheme);
function checkNarrow(){const n=window.innerWidth<400&&S.big||window.innerWidth<330;$('app').classList.toggle('narrow',n)}
addEventListener('resize',checkNarrow);

/* ---------- battery form (first run + sheet) ---------- */
function batFormHTML(id){return `
<div class="fld" data-kwhpart><span class="lab2">${T('common')}</span><div class="presets" role="group" aria-label="${T('common')}">${['5.12','10.24','15'].map(v=>`<button type="button" data-preset="${v}" aria-pressed="false"><span class="ck">${ic('check')}</span><b>${nf(+v,2)}</b><span>kWh</span></button>`).join('')}</div></div>
<div class="fld" data-kwhpart><label class="lab" for="${id}cap">${id==='f'?T('otherCap'):T('capacity')}</label><div class="box" id="${id}capB"><input id="${id}cap" inputmode="decimal" autocomplete="off" placeholder="${S.lang==='es'?'Ej.: 10,24':'E.g. 10.24'}"><span class="u">kWh</span></div><div class="msgs" id="${id}capM"></div><span class="hint">${T('capHint')}</span></div>
<div class="fld" data-ahpart hidden><div class="g2"><div><label class="lab" for="${id}v">${T('volts')}</label><div class="box" id="${id}vB"><input id="${id}v" inputmode="decimal" autocomplete="off"><span class="u">V</span></div></div><div><label class="lab" for="${id}ah">${T('ah')}</label><div class="box" id="${id}ahB"><input id="${id}ah" inputmode="decimal" autocomplete="off"><span class="u">Ah</span></div></div></div><div class="msgs" id="${id}ahM"></div><span class="hint">${T('ahHint')}</span><div class="eq" id="${id}ahR" hidden><span class="badge b-info">${ic('eq')}</span><span></span></div></div>`}
function mountBatForms(){
  document.querySelectorAll('[data-batform]').forEach(host=>{
    const id=host.closest('#first')?'f':'s';
    host.innerHTML=batFormHTML(id);
    host.style.display='flex';host.style.flexDirection='column';host.style.gap='16px';
    const root=host.parentElement;
    host.querySelectorAll('[data-preset]').forEach(b=>b.addEventListener('click',()=>{draftBat.mode='kwh';draftBat.capTxt=nf(+b.dataset.preset,2);$(id+'cap').value=draftBat.capTxt;syncBat(id)}));
    ['cap','v','ah'].forEach(f=>{const e=$(id+f);e.addEventListener('input',()=>{filterNum(e);draftBat[f==='cap'?'capTxt':f==='v'?'volt':'ahTxt']=e.value;syncBat(id)});e.addEventListener('blur',()=>{touched[id+f]=1;syncBat(id)})});
  });
}
function batCalc(d){
  if(d.mode==='kwh'){const p=parse(d.capTxt,false);if(p.empty)return{empty:true};if(!(p.v>0))return{err:{f:'cap',m:isNaN(p.v)?T('numBad'):T('gt0')}};return{cap:p.v,warn:p.v>WEIRD_KWH?'cap':null}}
  const v=parse(d.volt,false),a=parse(d.ahTxt,true);
  if(v.empty||a.empty)return{empty:true};
  if(!(v.v>0))return{err:{f:'v',m:isNaN(v.v)?T('numBad'):T('gt0')}};
  if(!(a.v>0))return{err:{f:'ah',m:isNaN(a.v)?T('numBad'):T('gt0')}};
  const c=v.v*a.v/1000;return{cap:c,warn:c>WEIRD_KWH?'ah':null};
}
function syncBat(id){
  const d=draftBat,root=document.querySelector(id==='f'?'#first':'#shBat');
  root.querySelectorAll('[data-seg=batmode] button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===d.mode));
  root.querySelectorAll('[data-kwhpart]').forEach(e=>e.hidden=d.mode!=='kwh');
  root.querySelectorAll('[data-ahpart]').forEach(e=>e.hidden=d.mode!=='ah');
  root.querySelectorAll('[data-preset]').forEach(b=>{const p=parse(d.capTxt,false);b.setAttribute('aria-pressed',d.mode==='kwh'&&Math.abs(p.v-+b.dataset.preset)<1e-9)});
  const r=batCalc(d);
  const capM=$(id+'capM'),ahM=$(id+'ahM');capM.innerHTML='';ahM.innerHTML='';
  ['cap','v','ah'].forEach(f=>$(id+f+'B').classList.remove('err','warn'));
  if(r.err&&touched[id+r.err.f]){$(id+r.err.f+'B').classList.add('err');(r.err.f==='cap'?capM:ahM).innerHTML=msg('err',r.err.m)}
  if(r.warn){$(id+r.warn+'B').classList.add('warn');(r.warn==='cap'?capM:ahM).innerHTML+=msg('warn',T('weird'))}
  const ar=$(id+'ahR');ar.hidden=!(d.mode==='ah'&&r.cap);if(r.cap)ar.lastElementChild.innerHTML=T('ahResult')(nf(r.cap,2));
  const ok=!!r.cap;
  if(id==='f')$('startBtn').disabled=!ok;else $('batDone').disabled=!ok;
  return r;
}
function openBatDraft(id){draftBat={mode:S.batmode,capTxt:S.capTxt,volt:S.volt,ahTxt:S.ahTxt};delete touched[id+'cap'];delete touched[id+'v'];delete touched[id+'ah'];$(id+'cap').value=draftBat.capTxt;$(id+'v').value=draftBat.volt;$(id+'ah').value=draftBat.ahTxt;syncBat(id)}
function commitBat(){const r=batCalc(draftBat);if(!r.cap)return false;S.batmode=draftBat.mode;S.capTxt=draftBat.capTxt;S.volt=draftBat.volt;S.ahTxt=draftBat.ahTxt;S.cap=r.cap;save();return true}

/* ---------- helpers ---------- */
function msg(k,t){const i={err:'alertc',warn:'warn',info:'info'}[k];return `<span class="msg m-${k}" ${k==='err'?'role="alert"':''}>${ic(i)}<span>${t}</span></span>`}
function filterNum(e){const a=e.value,n=a.replace(/[^\d.,]/g,'').slice(0,12);if(n!==a){e.value=n;e.dataset.filtered='1'}}
function vd(k,title,text,extra=''){return `<div class="vd k-${k}" role="status"><span class="badge b-${k}">${ic({ok:'check',bad:'alert',info:'plug',warn:'warn',err:'alert'}[k])}</span><div class="t"><b>${title}</b><span class="x">${text}</span>${extra}</div></div>`}
function stc(kick,ki,k,title,text,go,icon){return `<div class="kick"><span>${ic(ki)}${kick}</span></div><div class="stc"><span class="badge b-${k}">${ic(icon||{ok:'check',err:'alert',bad:'alert',neutral:'bolt'}[k])}</span><div><b>${title}</b><span>${text}</span></div></div>`+(go?`<button type="button" class="sec sm" data-go="${go}">${ic('down')}<span>${T('goField')}</span></button>`:'')}
function figs(a){return `<div class="figs" style="--n:${a.length}">${a.map(([v,l])=>`<div class="fig"><b>${v}</b><span>${l}</span></div>`).join('')}</div>`}
function leg(a){return `<div class="leg" style="--n:${a.length}">${a.map(([i,l,v])=>`<div><span>${i?ic(i).replace('class="i ','class="i " style="width:.95rem;height:.95rem;vertical-align:-2px;margin-right:3px" '):''}${l}</span><b>${v}</b></div>`).join('')}</div>`}
const kickRow=(i,t)=>`<div class="kick"><span>${ic(i)}${t}</span><button type="button" class="ibtn" data-share aria-label="${T('share')}">${ic('share')}</button></div>`;

/* ---------- NIGHT ---------- */
let NR=null,CR=null; // last results for report
function night(){
  const out={msgs:{nPct:[],nW:[],nRsv:[]},err:{}};
  const cap=S.cap;
  const pP=parse(S.nPct,false),wP=parse(S.nW,true),rP=parse(S.rsv,false);
  let rsv=RSV_DEF,rsvOk=true;
  if(rP.empty||isNaN(rP.v)||rP.v<0||rP.v>90){rsvOk=false;out.msgs.nRsv.push(['err',T('rsvBad')]);out.err.nRsv=1}else rsv=rP.v;
  if(pP.empty||isNaN(pP.v)||pP.v<0||pP.v>100){out.err.nPct=1;out.msgs.nPct.push(['err',pP.empty||isNaN(pP.v)?T('numBad'):T('pctBad')])}
  if(wP.note&&isFinite(wP.v))out.msgs.nW.push(['info',T('readAs')(num(wP.v)+' W',wP.alt+' W',T(wP.sep))]);
  if(!wP.empty&&(isNaN(wP.v)||wP.v<0)){out.err.nW=1;out.msgs.nW.push(['err',T('numBad')])}
  if(wP.v>WEIRD_KW*1000)out.msgs.nW.push(['warn',T('weird')]);
  out.rsv=rsv;out.pct=pP.v;
  const W=wP.v,a=pP.v;
  if(out.err.nPct){out.state='fix';out.fix=['fixPct','nPct'];return out}
  if(!rsvOk){out.state='fix';out.fix=['fixRsv','nRsv'];return out}
  if(wP.empty){out.state='empty';return out}
  if(out.err.nW){out.state='fix';out.fix=['fixW','nW'];return out}
  const s=S.loss?LOSS:1,i=Math.max(0,a-rsv),c=cap*i/100*s,d=W/1000,u=d>0?c/d:Infinity,hPer=cap*0.01*s;
  const now=mins(S.nNow),sun=mins(S.nSun),wm=Math.round(60*u);
  Object.assign(out,{a,W,i,c,d,u,now,sun,s,hPer,state:i===0?'inRsv':d===0?'noLoad':'ok'});
  // verdict
  if(now!==null&&sun!==null&&i>0&&d>0){let e=sun-now;if(e<0)e+=1440;if(e>0){const ah=e/60,need=d*ah;out.toSun=ah;

/* ---------- CHARGE ---------- */
function charge(){
  const out={msgs:{cPct:[],cW:[]},err:{}};
  const cap=S.cap,aP=parse(S.cPct),oP=parse(S.cTgt);
  const bad=p=>p.empty||isNaN(p.v)||p.v<0||p.v>100;
  if(bad(aP)){out.err.cPct=1;out.msgs.cPct.push(['err',T('pctBad')])}
  if(bad(oP)){out.err.cTgt=1;out.msgs.cPct.push(['err',T('tgtBad')])}
  let W,wEmpty=false;
  if(S.pmode==='w'){const w=parse(S.cW,true);if(w.note&&isFinite(w.v))out.msgs.cW.push(['info',T('readAs')(num(w.v)+' W',w.alt+' W',T(w.sep))]);wEmpty=w.empty;W=w.v;if(!w.empty&&!(w.v>0)){out.err.cW=1;out.msgs.cW.push(['err',isNaN(w.v)?T('numBad'):T('gt0')])}}
  else{const A=parse(S.cA,true),V=parse(S.cV);wEmpty=A.empty||V.empty;W=A.v*V.v;out.A=A.v;out.V=V.v;
    if(!A.empty&&!(A.v>0)){out.err.cA=1;out.msgs.cW.push(['err',isNaN(A.v)?T('numBad'):T('gt0')])}
    if(!V.empty&&!(V.v>0)){out.err.cV=1;out.msgs.cW.push(['err',isNaN(V.v)?T('numBad'):T('gt0')])}
    if(W>0)out.msgs.cW.push(['info',T('aResult')(nf(W,2))])}
  if(W>WEIRD_KW*1000)out.msgs.cW.push(['warn',T('weird')]);
  out.a=aP.v;out.o=oP.v;out.W=W;
  if(out.err.cPct||out.err.cTgt){out.state='fix';out.fix=['fixC',out.err.cPct?'cPct':'cTgt'];return out}
  if(wEmpty||!(W>0)){out.state='noPow';return out}
  const a=aP.v,o=oP.v;
  if(o<=a){out.state='already';return out}
  const c=o-a,d=cap*c/100,u=W/1000,hh=Math.max(a,SLOW_AT),g=Math.max(0,Math.min(o,SLOW_AT)-a),m=Math.max(0,o-hh),p=cap*g/100,f=cap*m/100,v=Math.round(p/u*60),w=Math.round(f/(u/2)*60),b=(v+w)/60,y=Math.min(100,u/cap*100);
  Object.assign(out,{state:'ok',c,d,u,g,m,p,f,v,w,b,y,grid:d/LOSS,now:mins(S.cNow)});
  const L=[];
  if(S.pmode==='a')L.push(T('lAmps')(nf(out.A,2),nf(out.V,2),nf(W,2)));
  L.push(T('lDelta')(nf(o,2),nf(a,2),nf(c,2)));L.push(T('lKwh')(nf(cap,3)+' kWh',nf(c,2),B3(d)));
  const pw=x=>x<1?nf(x*1000,2)+' W':nf(x,3)+' kW';
  if(g>0&&m>0){L.push(T('lFast')(nf(a,2),nf(Math.min(o,SLOW_AT),2),B3(p),pw(u),dur(v/60)));L.push(T('lSlow')(nf(hh,2),nf(o,2),B3(f),pw(u/2),dur(w/60)));L.push(T('lTotal')(dur(v/60),dur(w/60),dur(b)))}
  else if(m>0)L.push(T('lSlow')(nf(hh,2),nf(o,2),B3(f),pw(u/2),dur(w/60)));
  else L.push(T('lTime')(B3(d),pw(u),dur(b)));
  out.steps=L;return out;
}

/* ---------- toast ---------- */
let tt;function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,2600)}

/* ---------- report PNG ---------- */
let repBlob=null,repName='';
function wrap(ctx,text,x,y,maxW,lh,draw=true){const words=String(text).split(' ');let line='',yy=y;for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){if(draw)ctx.fillText(line,x,yy);line=w;yy+=lh}else line=t}if(draw)ctx.fillText(line,x,yy);return yy+lh}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
async function makeReport(){
  await document.fonts.ready;
  const night=S.tab==='night',r=night?NR:CR;
  const C={bg:'#EEF2F6',sf:'#FFFFFF',sf2:'#E3E9F0',tx:'#122033',tx2:'#46566C',ok:'#1E6B4A',okBg:'#E2F3EA',bad:'#A3392E',badBg:'#FBE8E5',inf:'#1F5FA8',infBg:'#E3EDFA',amb:'#E39B2D',track:'#D5DDE7',ln:'#74859C',ln2:'#D3DBE5',chg:'#2F7D5B'};
  const W=1080,P=64,F=(w,s)=>`${w} ${s}px AH, system-ui, sans-serif`;
  const cv=document.createElement('canvas');cv.width=W;cv.height=2600;const x=cv.getContext('2d');
  x.textBaseline='top';
  let footY=0;
  const draw=(y0,doDraw)=>{
    let y=y0;
    // header
    if(doDraw){x.fillStyle='#0D1626';x.fillRect(0,0,W,200)}
    y=200+48;
    const res=(night?$('nRes'):$('cRes'));
    const lead=res.querySelector('.lead')?.textContent||'',big=res.querySelector('.big')?.textContent||'',sub=res.querySelector('.sub')?.textContent||'';
    x.fillStyle=C.tx2;x.font=F(400,42);y=wrap(x,(night&&r.W?(S.lang==='es'?`Con ${nf(r.W,2)} W, `+lead.charAt(0).toLowerCase()+lead.slice(1):`Using ${nf(r.W,2)} W, `+lead.charAt(0).toLowerCase()+lead.slice(1)):lead),P,y,W-2*P,54,doDraw);
    x.fillStyle=C.tx;x.font=F(700,big.length>12?110:156);if(doDraw)x.fillText(big,P-4,y);y+=big.length>12?124:170;
    if(sub){x.font=F(700,40);y=wrap(x,sub,P,y,W-2*P,52,doDraw)+6}
    // verdict
    const v=res.querySelector('.vd');
    if(v){const k=v.classList.contains('k-ok')?['ok','okBg']:v.classList.contains('k-bad')?['bad','badBg']:['inf','infBg'];
      x.font=F(700,56);const tt=v.querySelector('b').textContent;x.font=F(400,38);const tx=v.querySelector('.x').textContent;
      x.font=F(700,56);const h1=wrap(x,tt,P+160,0,W-2*P-196,66,false);x.font=F(400,38);const h2=wrap(x,tx,P+160,0,W-2*P-196,52,false);
      const bh=Math.max(150,h1+h2+64);
      if(doDraw){x.fillStyle=C[k[1]];rr(x,P,y,W-2*P,bh,36);x.fill();x.fillStyle=C[k[0]];x.beginPath();x.arc(P+84,y+84,48,0,7);x.fill();
        x.strokeStyle=C[k[1]];x.lineWidth=10;x.lineCap='round';x.lineJoin='round';x.beginPath();if(k[0]==='ok'){x.moveTo(P+62,y+86);x.lineTo(P+78,y+102);x.lineTo(P+108,y+70)}else if(k[0]==='bad'){x.moveTo(P+84,y+60);x.lineTo(P+84,y+92);x.moveTo(P+84,y+110);x.lineTo(P+84,y+111)}else{x.moveTo(P+70,y+60);x.lineTo(P+70,y+76);x.moveTo(P+98,y+60);x.lineTo(P+98,y+76);x.moveTo(P+62,y+80);x.lineTo(P+106,y+80);x.lineTo(P+106,y+90);x.arc(P+84,y+90,22,0,Math.PI);x.lineTo(P+62,y+80);x.moveTo(P+84,y+112);x.lineTo(P+84,y+124)}x.stroke();
        x.fillStyle=C[k[0]];x.font=F(700,56);wrap(x,tt,P+160,y+32,W-2*P-196,66);x.fillStyle=C.tx;x.font=F(400,38);wrap(x,tx,P+160,y+32+h1,W-2*P-196,52)}
      y+=bh+40}
    // track
    if(night&&r.v&&r.now!==null){const days=isDays(r.u),span=days?r.toSun/0.06:Math.max(r.u,r.toSun)*1.04,fill=days?100:Math.min(100,r.u/span*100),sun=Math.max(4,Math.min(98,r.toSun/span*100));
      const tw=W-2*P-30,ty=y+30;
      if(doDraw){x.fillStyle=C.track;rr(x,P,ty,tw,34,17);x.fill();x.strokeStyle=C.ln;x.lineWidth=3;x.stroke();x.fillStyle=C.amb;rr(x,P,ty,tw*fill/100,34,17);x.fill();
        if(!r.v.ok){x.save();rr(x,P+tw*fill/100,ty,tw*(sun-fill)/100,34,4);x.clip();x.strokeStyle='#B5574B';x.lineWidth=7;for(let k=-40;k<tw;k+=18){x.beginPath();x.moveTo(P+k,ty+40);x.lineTo(P+k+40,ty-6);x.stroke()}x.restore()}
        if(!days){x.fillStyle=C.tx;rr(x,P+tw*fill/100-5,ty-16,10,66,5);x.fill()}
        const sx=P+tw*sun/100;x.fillStyle=C.sf;x.beginPath();x.arc(sx,ty+17,44,0,7);x.fill();x.strokeStyle=C.tx;x.lineWidth=6;x.stroke();x.lineWidth=4;x.lineCap='round';x.beginPath();x.arc(sx,ty+17,13,0,7);x.stroke();for(let a=0;a<8;a++){const an=a*Math.PI/4;x.beginPath();x.moveTo(sx+Math.cos(an)*21,ty+17+Math.sin(an)*21);x.lineTo(sx+Math.cos(an)*28,ty+17+Math.sin(an)*28);x.stroke()}
        const items=[[T('lNow'),fmtT(r.now)]],endI=[T('lEnd'),days?T('inDays')(dur(r.u)):fmtT(r.now+60*r.u)],sunI=[T('lSun'),fmtT(r.sun)];if(fill<sun)items.push(endI,sunI);else items.push(sunI,endI);
        items.forEach((it,i)=>{const al=i===0?'left':i===1?'center':'right',xx=i===0?P:i===1?W/2:W-P;x.textAlign=al;x.fillStyle=C.tx2;x.font=F(400,30);x.fillText(it[0],xx,ty+86);x.fillStyle=C.tx;x.font=F(700,40);x.fillText(it[1],xx,ty+126)});x.textAlign='left'}
      y+=230}
    // figures
    const fs=[...res.querySelectorAll('.fig')].map(f=>[f.querySelector('b').textContent,f.querySelector('span').textContent]);
    if(fs.length){const cw=(W-2*P-16*(fs.length-1))/fs.length;fs.forEach((f,i)=>{const fx=P+i*(cw+16);if(doDraw){x.fillStyle=C.sf2;rr(x,fx,y,cw,150,24);x.fill();x.fillStyle=C.tx;x.font=F(700,fs.length>2?46:56);x.fillText(f[0],fx+24,y+28);x.fillStyle=C.tx2;x.font=F(400,30);x.fillText(f[1],fx+24,y+96)}});y+=190}
    // data + steps
    const data=night?[[T('dBat'),nf(S.cap,2)+' kWh'],[T('dLevel'),nf(r.a,2)+'%'],[T('dLoad'),nf(r.W,2)+' W'],[T('dAt'),r.now!==null?fmtT(r.now):'—'],[T('dSun'),r.sun!==null?fmtT(r.sun):'—'],[T('dRsv'),nf(r.rsv,2)+'%'],[T('dLoss'),S.loss?T('lossYes'):T('lossNo')]]
      :[[T('dBat'),nf(S.cap,2)+' kWh'],[T('dLevel'),nf(r.a,2)+'%'],[T('dTgt'),nf(r.o,2)+'%'],[T('dPow'),nf(r.W,2)+' W'],[T('dAt'),r.now!==null?fmtT(r.now):'—']];
    const colW=(W-2*P-48)/2;
    x.fillStyle=C.tx;x.font=F(700,36);if(doDraw){x.fillText(T('dataUsed'),P,y);x.fillText(T('howR'),P+colW+48,y)}
    let y1=y+60,y2=y+60;
    data.forEach(([a,b])=>{x.font=F(700,30);const bw=x.measureText(b).width;x.font=F(400,30);x.fillStyle=C.tx2;const ye=wrap(x,a,P,y1,colW-bw-20,40,doDraw);if(doDraw){x.fillStyle=C.tx;x.font=F(700,30);x.fillText(b,P+colW-bw,y1);x.fillStyle=C.ln2;x.fillRect(P,ye+8,colW,2)}y1=ye+26});
    (r.steps||[]).forEach((l,i)=>{if(doDraw){x.fillStyle=C.sf2;x.beginPath();x.arc(P+colW+48+22,y2+20,22,0,7);x.fill();x.fillStyle=C.tx;x.font=F(700,24);x.fillText(String(i+1),P+colW+48+15,y2+8)}x.font=F(400,29);x.fillStyle=C.tx;y2=wrap(x,l,P+colW+48+60,y2,colW-60,40,doDraw)+14});
    y=Math.max(y1,y2)+30;
    x.fillStyle=C.tx2;x.font=F(400,30);y=wrap(x,night?T('footN')(nf(r.rsv,2)):T('footC'),P,y,W-2*P,44,doDraw)+40;
    footY=y;if(doDraw){x.font=F(400,28);x.fillText(T('appName')+' · '+T('offline').toLowerCase(),P+64,y+10)}
    return y+80;
  };
  const H=draw(0,false);cv.height=H;x.textBaseline='top';
  x.fillStyle=C.bg;x.fillRect(0,0,W,H);
  draw(0,true);
  // header text + logo
  const logo=new Image();logo.src='data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">${LOGO}</svg>`);
  await new Promise(r=>{logo.onload=r;logo.onerror=r});
  x.save();rr(x,P,48,104,104,26);x.clip();x.drawImage(logo,P,48,104,104);x.restore();
  x.fillStyle='#F2F5F9';x.font=F(700,50);x.fillText(T('rTitleN'),P+132,52);
  x.fillStyle='#F6BC5E';x.font=F(400,34);x.fillText(night?T('rSubN'):T('rSubC'),P+132,116);
  const d=new Date(),ds=d.toLocaleDateString(S.lang==='es'?'es-ES':'en-US',{day:'numeric',month:'short',year:'numeric'});
  x.fillStyle='#B4C0D0';x.font=F(400,28);const w1=x.measureText(ds).width,ts=fmtT(d.getHours()*60+d.getMinutes()),w2=x.measureText(ts).width;x.fillText(ds,W-P-w1,62);x.fillText(ts,W-P-w2,102);
  x.drawImage(logo,P,footY,48,48);
  repName=(night?T('fileN'):T('fileC'))+'.png';
  return new Promise(res=>cv.toBlob(b=>res(b),'image/png'));
}
async function openShare(){
  const r=S.tab==='night'?NR:CR;if(!r||r.state!=='ok'){toast(T('fixFirst'));return}
  repBlob=await makeReport();
  const url=URL.createObjectURL(repBlob);$('shImg').src=url;$('shImg').alt=repName;$('shName').textContent=repName;openSheet('shShare');
}
let DL=null;(async()=>{try{if(window.claude&&window.claude.use)DL=await window.claude.use('downloads')}catch(e){}})();
async function download(){if(DL){try{await DL.save({filename:repName,data:repBlob});return true}catch(e){if(e&&e.code==='declined')return false}}
  const a=document.createElement('a');a.href=URL.createObjectURL(repBlob);a.download=repName;document.body.appendChild(a);a.click();a.remove();return true}
$('doSave').addEventListener('click',async()=>{if(await download())toast(T('saved')(repName))});
$('doShare').addEventListener('click',async()=>{const f=new File([repBlob],repName,{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:T('rTitleN')});return}}catch(e){if(e&&e.name==='AbortError')return}if(await download())toast(T('noShare'))});

/* ---------- init ---------- */
paintStatic();mountBatForms();applyTheme();paintSegs();
io.observe($('nRes'));io.observe($('cRes'));
if(S.cap){showMain()}else{draftBat={mode:S.batmode,capTxt:S.capTxt,volt:S.volt,ahTxt:S.ahTxt};showFirst()}
})();
</script>
